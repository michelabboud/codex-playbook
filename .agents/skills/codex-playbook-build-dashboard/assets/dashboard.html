<!doctype html>
<!-- codex-build-task-dashboard-v1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Codex · Operations</title>
<style>
:root {
  color-scheme:light;
  --bg:#edf1f7;
  --panel:#fff;
  --subtle:#f5f7fb;
  --ink:#192639;
  --muted:#56657a;
  --line:#d8e0eb;
  --blue:#245ad2;
  --selected:#eaf0ff;
  --good:#176b50;
  --good-bg:#e4f3ec;
  --warn:#81530b;
  --warn-bg:#fff2d6;
  --bad:#a02b42;
  --bad-bg:#ffe8ed
}

:root[data-theme=dark] {
  color-scheme:dark;
  --bg:#101722;
  --panel:#182231;
  --subtle:#1d2a3b;
  --ink:#e4eaf3;
  --muted:#a4b3c7;
  --line:#344359;
  --blue:#8eafff;
  --selected:#233a62;
  --good:#86d5b5;
  --good-bg:#193e34;
  --warn:#f1c975;
  --warn-bg:#43371f;
  --bad:#ffabbc;
  --bad-bg:#492737
}

* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif
}
button,input,select {
  font:inherit;
  color:inherit
}
button,select,input {
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:6px
}
button,select {
  cursor:pointer
}
button {
  padding:7px 11px
}
button:hover {
  background:var(--subtle)
}
button:disabled {
  cursor:default;
  opacity:.5
}
:focus-visible {
  outline:3px solid var(--blue);
  outline-offset:2px
}
a {
  color:var(--blue);
  overflow-wrap:anywhere
}
h1,h2,h3,p {
  margin:0
}
h1 {
  font-size:18px;
  letter-spacing:-.5px
}
h2 {
  font-size:22px;
  line-height:1.25;
  letter-spacing:-.5px;
  overflow-wrap:anywhere
}
h3 {
  font-size:12px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--muted)
}
.muted {
  color:var(--muted)
}
.mono,code,pre,time {
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace
}
.shell {
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:1900px;
  margin:auto;
  padding:0 22px;
  gap:12px;
  overflow:hidden
}
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-shrink:0;
  padding-top:16px
}
.brand {
  display:flex;
  gap:12px;
  align-items:center
}
.brand-mark {
  display:grid;
  place-items:center;
  width:31px;
  height:31px;
  border-radius:8px;
  background:var(--blue);
  color:var(--panel);
  font:800 18px ui-monospace,monospace
}
.top-tools {
  display:flex;
  align-items:center;
  gap:8px
}
.refresh-control {
  display:flex;
  align-items:center;
  gap:5px;
  font-size:12px;
  color:var(--muted)
}
.top-tools select {
  padding:5px;
  max-width:110px
}
.projects {
  display:flex;
  gap:5px;
  overflow-x:auto;
  flex-shrink:0;
  padding:3px 2px 8px;
  border-bottom:1px solid var(--line);
  scrollbar-width:thin
}
.project-tab {
  display:flex;
  gap:9px;
  align-items:center;
  white-space:nowrap;
  border-color:transparent;
  color:var(--muted);
  padding:9px 12px
}
.project-tab[aria-selected=true] {
  color:var(--blue);
  background:var(--selected);
  border-color:var(--line);
  font-weight:700
}
.tab-count {
  font:12px ui-monospace,monospace;
  padding:1px 5px;
  background:var(--subtle);
  border-radius:4px
}
.dot {
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--warn);
  display:inline-block
}
.overview {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-shrink:0
}
.overview p {
  color:var(--muted);
  font-size:12px
}
.attention {
  flex-shrink:0;
  background:var(--warn-bg);
  color:var(--warn);
  border:1px solid var(--warn);
  border-radius:6px;
  padding:8px 12px;
  font-size:12px
}
.workspace {
  display:grid;
  grid-template-columns:minmax(280px,38%) minmax(0,1fr);
  min-height:0;
  flex:1;
  gap:14px
}
.queue,.inspector {
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden
}
.queue {
  display:flex;
  flex-direction:column
}
.filters {
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  padding:13px;
  border-bottom:1px solid var(--line)
}
.filters input {
  min-width:0;
  width:100%;
  padding:8px 10px
}
.filters select {
  padding:6px;
  max-width:140px;
  min-width:0
}
.secondary-filters {
  display:flex;
  gap:8px;
  grid-column:1/-1
}
.secondary-filters label {
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--muted);
  font-size:11px;
  min-width:0;
  flex:1
}
.secondary-filters select {
  width:100%;
  max-width:none
}
.list-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.06em
}
.task-list {
  overflow:auto;
  min-height:0;
  padding:0 7px 9px;
  scrollbar-width:thin
}
.task-row {
  width:100%;
  display:block;
  text-align:left;
  border:1px solid transparent;
  border-radius:7px;
  margin:2px 0;
  padding:11px 9px;
  background:transparent
}
.task-row[aria-pressed=true] {
  background:var(--selected);
  border-color:var(--blue)
}
.task-top {
  display:flex;
  align-items:start;
  justify-content:space-between;
  gap:8px
}
.task-name {
  font-size:13px;
  font-weight:650;
  overflow-wrap:anywhere
}
.task-meta {
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  margin-top:6px;
  color:var(--muted);
  font-size:11px
}
.task-excerpt {
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.badge {
  display:inline-block;
  font-size:10px;
  font-weight:650;
  line-height:1.5;
  padding:2px 6px;
  border-radius:4px;
  white-space:nowrap;
  background:var(--subtle);
  color:var(--muted)
}
.running,.testing,.review {
  background:var(--selected);
  color:var(--blue)
}
.done,.passed,.published {
  background:var(--good-bg);
  color:var(--good)
}
.blocked,.stale {
  background:var(--warn-bg);
  color:var(--warn)
}
.failed,.rejected {
  background:var(--bad-bg);
  color:var(--bad)
}
.age {
  font-size:11px;
  color:var(--muted)
}
.age.stale {
  color:var(--warn);
  white-space:normal
}
.inspector {
  overflow:auto;
  scrollbar-width:thin
}
.inspector-head {
  padding:21px 24px 17px;
  border-bottom:1px solid var(--line)
}
.inspector-head .task-meta {
  margin:10px 0 0
}
.section {
  padding:18px 24px;
  border-bottom:1px solid var(--line)
}
.section h3 {
  margin-bottom:10px
}
.full-text {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px
}
.description {
  font-size:14px;
  margin-bottom:12px
}
.fields {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px 20px;
  margin:0
}
.field {
  min-width:0
}
.field dt {
  font-size:11px;
  color:var(--muted);
  margin-bottom:3px
}
.field dd {
  margin:0;
  font-size:13px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.wide {
  grid-column:1/-1
}
.action-row {
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:13px
}
.action-row button,.action-row a {
  font-size:12px
}
.action-row a {
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:6px;
  text-decoration:none
}
.command {
  margin:10px 0 0;
  background:var(--subtle);
  border:1px solid var(--line);
  border-radius:5px;
  padding:10px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:12px
}
.gate-list {
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:13px
}
.gate-list div {
  font-size:11px;
  color:var(--muted)
}
.gate-list .badge {
  margin-left:4px
}
.history-controls {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:var(--muted);
  gap:8px;
  margin:10px 0
}
.history-controls button {
  padding:4px 8px
}
.event {
  padding:10px 0;
  border-top:1px solid var(--line);
  font-size:11px
}
.event pre {
  font-size:11px;
  background:var(--subtle);
  padding:8px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
.evidence-list {
  padding-left:18px;
  margin:0;
  font-size:12px
}
.empty {
  padding:28px 20px;
  color:var(--muted);
  font-size:13px
}
.foot {
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10px;
  color:var(--muted);
  padding-bottom:10px;
  gap:12px
}
.mobile-nav {
  display:none
}
.toast {
  font-size:12px;
  color:var(--blue)
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0)
}
details>summary {
  cursor:pointer;
  font-size:12px;
  color:var(--muted)
}
details[open]>summary {
  margin-bottom:14px
}
[hidden] {
  display:none!important
}

@media(max-width:850px) {
  .shell {
  padding:0 12px;
  gap:9px
}
.workspace {
  grid-template-columns:minmax(250px,42%) minmax(0,1fr);
  gap:9px
}
.section,.inspector-head {
  padding:16px
}
.fields {
  gap:12px
}
.brand .muted {
  display:none
}
.refresh-control span {
  display:none
}

}

@media(max-width:620px) {
  .shell {
  padding:0 10px;
  gap:8px
}
.topbar {
  padding-top:10px;
  gap:8px
}
.brand {
  gap:7px
}
h1 {
  font-size:15px
}
.brand-mark {
  width:26px;
  height:26px;
  font-size:15px
}
.top-tools {
  gap:5px
}
.top-tools select {
  max-width:78px;
  font-size:11px
}
.top-tools button {
  padding:5px 7px;
  font-size:11px
}
.overview p {
  font-size:11px
}
.overview {
  align-items:start
}
.workspace {
  display:flex;
  gap:0
}
.queue,.inspector {
  width:100%
}
.workspace[data-view=tasks] .inspector {
  display:none
}
.workspace[data-view=details] .queue {
  display:none
}
.mobile-nav {
  display:flex;
  gap:4px
}
.mobile-nav button {
  font-size:11px;
  padding:5px 8px
}
.mobile-nav button[aria-pressed=true] {
  background:var(--selected);
  color:var(--blue)
}
.attention {
  font-size:11px;
  max-height:88px;
  overflow:auto;
  padding:6px 9px
}
.foot .explanation {
  display:none
}
.fields {
  grid-template-columns:1fr 1fr
}
.project-tab {
  padding:7px 9px
}
.projects {
  padding-bottom:5px
}
.filters {
  padding:10px
}
.inspector-head h2 {
  font-size:20px
}

}

/* Now view: a compact overview above the bounded operations workspace. */
:root {
  --bg:#f2f4f7;
  --subtle:#f7f8fa;
  --line:#dce2eb;
  --blue:#315ed0;
  --selected:#edf2fc
}

:root[data-theme=dark] {
  --bg:#11151c;
  --panel:#191f29;
  --subtle:#222b39;
  --line:#343e4d;
  --blue:#9ab7ff;
  --selected:#24344f
}

.topbar {
  padding-top:18px
}
.brand-mark {
  border-radius:10px
}
.brand h1 {
  font-size:23px;
  letter-spacing:-.8px
}
.brand .muted {
  font-size:11px
}
.projects {
  padding-bottom:6px;
  border-bottom:0
}
.project-tab {
  font-size:12px;
  padding:8px 12px
}
.project-tab[aria-selected=true] {
  border-color:var(--line)
}
.overview {
  gap:10px
}
.overview p {
  font-size:11px
}
.attention {
  border:0;
  border-radius:7px;
  font-size:11px;
  padding:8px 12px
}
.signals {
  flex-shrink:0;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  overflow:hidden
}
.signals>summary {
  padding:10px 12px;
  font-size:12px;
  color:var(--muted)
}
.signals[open]>summary {
  margin:0;
  padding-bottom:0
}
.signal-grid {
  display:grid;
  grid-template-columns:minmax(220px,1.1fr) minmax(210px,1fr) minmax(230px,1.1fr);
  gap:20px;
  padding:12px 16px
}
.metrics {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  align-items:center;
  gap:10px
}
.metric strong {
  display:block;
  font-size:25px;
  font-weight:650;
  letter-spacing:-1px;
  line-height:1.3
}
.metric span {
  display:block;
  font-size:10px;
  color:var(--muted);
  white-space:nowrap
}
.metric:first-child strong {
  color:var(--blue)
}
.chart h3 {
  font-size:10px;
  letter-spacing:.04em
}
.chart-label {
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:10px;
  color:var(--muted);
  margin-bottom:5px
}
.activity-bars {
  height:48px;
  display:flex;
  gap:8px;
  align-items:end
}
.activity-column {
  display:flex;
  flex:1;
  flex-direction:column;
  justify-content:end;
  align-items:center;
  min-width:0;
  height:100%
}
.activity-column i {
  width:100%;
  max-width:32px;
  background:var(--blue);
  opacity:.75;
  border-radius:3px 3px 0 0;
  min-height:1px
}
.activity-column span {
  font-size:9px;
  color:var(--muted);
  line-height:1.5;
  white-space:nowrap
}
.distribution-bar {
  height:6px;
  display:flex;
  gap:2px;
  margin:8px 0;
  border-radius:3px;
  overflow:hidden
}
.distribution-bar span {
  min-width:2px;
  background:var(--muted)
}
.distribution-bar .running,.distribution-bar .testing,.distribution-bar .review {
  background:var(--blue)
}
.distribution-bar .done {
  background:var(--good)
}
.distribution-bar .blocked {
  background:var(--warn)
}
.distribution-bar .failed {
  background:var(--bad)
}
.status-counts {
  display:flex;
  flex-wrap:wrap;
  gap:2px 9px;
  font-size:10px;
  color:var(--muted)
}
.status-counts span {
  white-space:nowrap
}
.project-label {
  font-size:10px;
  letter-spacing:.03em;
  color:var(--blue);
  margin-bottom:5px;
  overflow-wrap:anywhere
}
.queue,.detail-column {
  border-radius:11px
}
.task-row {
  border-radius:8px;
  padding:12px 10px
}
.task-row[aria-pressed=true] {
  border-color:var(--line);
  box-shadow:inset 3px 0 var(--blue)
}
.task-top .badge {
  font-size:9px
}
.detail-column {
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  background:var(--panel);
  border:1px solid var(--line);
  overflow:hidden
}
.detail-column .inspector {
  border:0;
  border-radius:0;
  flex:1
}
.inspector-nav {
  display:flex;
  gap:5px;
  border-bottom:1px solid var(--line);
  padding:7px 12px;
  flex-shrink:0
}
.inspector-nav button {
  border-color:transparent;
  background:transparent;
  font-size:12px;
  color:var(--muted)
}
.inspector-nav button[aria-selected=true] {
  background:var(--selected);
  color:var(--blue);
  font-weight:650
}
.plan-card {
  padding:20px 24px;
  border-bottom:1px solid var(--line)
}
.plan-card h2 {
  font-size:19px;
  margin:7px 0 10px
}
.plan-card .origin {
  font-size:10px;
  color:var(--muted);
  overflow-wrap:anywhere;
  margin:8px 0
}
.plan-card .fields {
  margin-top:15px
}
.plan-steps {
  list-style:none;
  margin:16px 0 0;
  padding:0;
  border-top:1px solid var(--line)
}
.plan-step {
  display:flex;
  align-items:start;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:12px
}
.plan-step[aria-current=step] {
  color:var(--blue);
  font-weight:650
}
.plan-step .step-name {
  min-width:0;
  overflow-wrap:anywhere
}
.plan-step .badges {
  display:flex;
  gap:5px
}
.plan-intro {
  padding:18px 24px;
  background:var(--subtle);
  border-bottom:1px solid var(--line);
  font-size:12px;
  color:var(--muted)
}
.plan-unavailable {
  font-size:13px;
  color:var(--muted)
}
.full-text+.fields {
  margin-top:12px
}
.action-row {
  margin-bottom:10px
}

@media(min-width:621px) {
  .signals>summary {
  display:none
}
.signal-grid {
  display:grid!important
}

}

@media(max-width:1000px) {
  .signal-grid {
  grid-template-columns:1fr 1fr;
  gap:14px
}
.signal-grid .metrics-block {
  grid-column:1/-1
}
.metric strong {
  font-size:21px
}
.metrics {
  max-width:400px
}
.signals {
  max-height:190px;
  overflow:auto
}

}

@media(max-width:620px) {
  .brand h1 {
  font-size:18px;
  letter-spacing:-.4px
}
.topbar {
  padding-top:11px
}
.signals {
  max-height:260px;
  overflow:auto
}
.signal-grid {
  grid-template-columns:1fr;
  gap:15px;
  padding:12px
}
.signal-grid .metrics-block {
  grid-column:auto
}
.signals>summary {
  padding:7px 11px
}
.signals[open]>summary {
  padding-bottom:0
}
.overview p {
  font-size:10px
}
.attention {
  max-height:62px;
  overflow:auto;
  padding:6px 9px;
  font-size:10px
}
.workspace[data-view=tasks] .detail-column {
  display:none
}
.workspace[data-view=details] .detail-column {
  display:flex;
  width:100%
}
.workspace[data-view=details] .detail-column .inspector:not([hidden]) {
  display:block
}
.inspector-nav {
  padding:5px 9px
}
.inspector-nav button {
  padding:6px 8px
}
.plan-card,.plan-intro {
  padding:16px
}
.plan-card h2 {
  font-size:18px
}
.project-tab {
  font-size:11px;
  padding:7px 10px
}

}

</style>
</head>
<body>
<main class="shell">
<header class="topbar">
<div class="brand">
<div class="brand-mark" aria-hidden="true">C</div>
<div>
<h1>Work in motion</h1>
<p class="muted" style="font-size:11px">Codex · shared local task board</p>
</div>
</div>
<div class="top-tools">
<label class="sr-only" for="theme">Color theme</label>
<select id="theme">
<option value="system">System</option>
<option value="light">Light</option>
<option value="dark">Dark</option>
</select>
<label class="refresh-control">
<input type="checkbox" id="refresh" checked aria-label="Auto refresh">
<span>Auto refresh</span>

}
function populateFilters() {
  const items=sessions.filter(s=>preferences.project===nowProject||s.project===preferences.project);
  for(const name of ['run','session']) {
    const select=document.getElementById(name);
    select.replaceChildren();
    const all=node('option','All '+(name==='run'?'runs':'sessions'));
    all.value='';
    select.append(all);
    for(const value of [...new Set(items.map(s=>s[name]))].sort()) {
      const option=node('option',value);
      option.value=value;
      select.append(option)
    }
    if(!items.some(s=>s[name]===preferences[name]))preferences[name]='';
    select.value=preferences[name]
  }
}
async function copy(value) {
  try {
    await navigator.clipboard.writeText(value);
    setText(document.getElementById('copy-status'),'Copied')
  }
  catch {
    setText(document.getElementById('copy-status'),'Copy unavailable. Select and copy the displayed text.')
  }
}
function copyButton(title,value) {
  const button=node('button',title);
  button.type='button';
  button.addEventListener('click',()=>copy(value));
  return button
}
function render() {
  ages.length=0;
  selectedSessions=sessions.filter(s=>(preferences.project===nowProject||s.project===preferences.project)&&(!preferences.run||s.run===preferences.run)&&(!preferences.session||s.session===preferences.session));
  const records=taskRecords(selectedSessions);
  visibleRecords=filterRecords(preferences.project===nowProject?nowRecords(records):records,preferences.status,preferences.search);
  const root=document.getElementById('task-list');
  root.replaceChildren();
  setText(document.getElementById('task-count'),String(visibleRecords.length));
  const sessionRecords=sessionOnlyRecords(selectedSessions).filter(record=>preferences.project!==nowProject||record.session.status==='active');
  const inspectorRecords=[...visibleRecords,...sessionRecords];
  if(!inspectorRecords.some(r=>r.key===preferences.task))preferences.task=inspectorRecords[0]?.key||'';
  for(const record of visibleRecords) {
    const  {
      task,session,key
    }
    =record,button=node('button',undefined,'task-row');
    button.type='button';
    button.dataset.key=key;
    button.setAttribute('aria-pressed',String(key===preferences.task));
    const top=node('div',undefined,'task-top');
    top.append(node('span',task.title,'task-name'),badge(task.status));
    if(preferences.project===nowProject)button.append(node('div',session.project.split(/[\\/]/).pop()+' / '+session.run,'project-label'));
    button.append(top);
    if(task.detail)button.append(node('div',task.detail,'task-excerpt'));
    const meta=node('div',undefined,'task-meta');
    meta.append(node('span',task.owner||'Unassigned'),node('span','· '+session.run),ageNode(task.updated,activeTask(task),'Task'));
    button.append(meta);
    button.addEventListener('click',()=> {
      preferences.task=key;
      preferences.pane='details';
      render();
      persist();
      showView('details');
      if(matchMedia('(max-width:620px)').matches) {
        const heading=document.querySelector('.inspector-head h2');
        heading.tabIndex=-1;
        heading.focus()
      }
      else document.querySelector('.task-row[aria-pressed=true]')?.focus( {
        preventScroll:true
      }
      )
    }
    );
    root.append(button)
  }
  for(const record of sessionRecords) {
    const button=node('button',undefined,'task-row session-row');
    button.type='button';
    button.dataset.key=record.key;
    button.setAttribute('aria-pressed',String(record.key===preferences.task));
    const top=node('div',undefined,'task-top');
    top.append(node('span',record.session.title,'task-name'),badge(record.session.status));
    button.append(top,node('p','Session details · no tasks posted','task-excerpt'),node('p',record.session.run+' / '+record.session.session,'task-meta mono'));
    button.addEventListener('click',()=>{
      preferences.task=record.key;
      preferences.pane='details';
      render();
      showView('details');
      const heading=document.querySelector('.inspector-head h2');
      heading.tabIndex=-1;
      heading.focus();
    });
    root.append(button);
  }
  if(!inspectorRecords.length)root.append(node('div',records.length?'No matching tasks. Change the status, search, run or session filter.':'No tasks have been posted for this project.','empty'));
  renderInspector(inspectorRecords.find(r=>r.key===preferences.task));
  renderPlans();renderCharts();showInspectorPane(preferences.pane);
  setText(document.querySelector('.list-heading span'),preferences.project===nowProject?'Active work · across projects':'Task queue · active first');
  updateAges();
  persist()
}
function renderInspector(record) {
  const root=document.getElementById('inspector');
  for(let i=ages.length-1;
  i>=0;
  i--)if(root.contains(ages[i].el))ages.splice(i,1);
  root.replaceChildren();
  if(!record) {
    root.append(node('div','Select a task to inspect its details and reported agent context.','empty'));
    return
  }
  if(historyTask!==record.key) {
    historyPage=0;
    historyTask=record.key
  }
  const  {
    task,session
  }
  =record,context=task?contexts.get(session).get(task.id):null,head=node('div',undefined,'inspector-head');
  head.append(node('h2',task?task.title:session.title));
  const meta=node('div',undefined,'task-meta');
  if(task)meta.append(badge(task.status),node('span',task.owner||'Unassigned'),ageNode(task.updated,activeTask(task),'Task'));
  else meta.append(badge(session.status),node('span','Session · no tasks posted'),ageNode(session.updated,session.status==='active','Session'));
  head.append(meta,node('p',session.run+' / '+session.session,'task-meta mono'));
  root.append(head);
  if(task) {
    const description=node('section',undefined,'section');
    const taskFields=node('dl',undefined,'fields');
    field(taskFields,'Task ID',task.id);
    field(taskFields,'Updated',task.updated);
    description.append(node('h3','Task details'),node('p',context?.description||'Description not reported.','full-text description'));
    if(task.detail)description.append(node('p',task.detail,'full-text'));
    description.append(taskFields);
    root.append(description);
    const agent=node('section',undefined,'section');
    agent.append(node('h3','Assigned agent'));
    if(!context)agent.append(node('p','No current agent context was reported for this task. Worker identity is unavailable.','full-text muted'));
    const fields=node('dl',undefined,'fields');
    for(const [key,title] of [['model','Model'],['effort','Reasoning effort'],['agent_id','Agent ID'],['codex_thread_id','Codex thread'],['worktree','Worktree'],['agent_url','Agent link'],['last_progress','Last progress'],['next_checkpoint','Next checkpoint'],['blocker','Blocker'],['decision','Decision']])field(fields,title,context?.[key],['worktree','blocker','decision'].includes(key));
    agent.append(fields);
    if(context?.command) {
      agent.append(node('h3','Reported command'),node('pre',context.command,'command'))
    }
    const actions=node('div',undefined,'action-row');
    if(context?.agent_url) {
      const url=safeURL(context.agent_url,true);
      if(url) {
        const a=node('a','Open agent');
        a.href=url;
        a.target='_blank';
        a.rel='noopener noreferrer';
        actions.append(a)
      }
    }
    if(context?.codex_thread_id) {
      const command='codex resume '+context.codex_thread_id;
      const code=node('pre',command,'command');
      code.tabIndex=0;
      agent.append(code);
      actions.append(copyButton('Copy resume command',command))
    }
    if(context?.agent_id)actions.append(copyButton('Copy agent ID',context.agent_id));
    if(context?.command)actions.append(copyButton('Copy reported command',context.command));
    if(!context?.agent_url&&!context?.codex_thread_id)agent.append(node('p','Native agent navigation is unavailable. Agent IDs are copyable when reported.','full-text muted'));
    if(actions.childElementCount)agent.insertBefore(actions,fields);
    root.append(agent);
    const evidence=node('section',undefined,'section');
    evidence.append(node('h3','Evidence'));
    const evidenceList=node('ul',undefined,'evidence-list');
    for(const url of task.evidence) {
      const safe=safeURL(url);
      const item=node('li');
      if(safe) {
        const a=node('a',url);
        a.href=safe;
        a.target='_blank';
        a.rel='noopener noreferrer';
        item.append(a)
      }
      else item.append(node('span',url));
      evidenceList.append(item)
    }
    evidence.append(task.evidence.length?evidenceList:node('p','No evidence links reported.','muted'));
    root.append(evidence);
  }
  const coordinator=node('section',undefined,'section'),details=node('details');
  details.open=!task;
  details.append(node('summary','Session & coordinator · '+session.session));
  const gates=node('div',undefined,'gate-list');
  for(const [key,title] of [['build','Build'],['review','Review'],['release','Publication']]) {
    const gate=node('div',title);
    gate.append(badge(session[key]));
    gates.append(gate)
  }
  details.append(gates);
  const coordinatorFields=node('dl',undefined,'fields');
  field(coordinatorFields,'Project',session.project,true);
  field(coordinatorFields,'Run',session.run);
  field(coordinatorFields,'Coordinator session',session.session);
  field(coordinatorFields,'Session state',session.status);
  field(coordinatorFields,'Session updated',session.updated);
  field(coordinatorFields,'Session title',session.title,true);
  field(coordinatorFields,'Created',session.created,true);
  field(coordinatorFields,'Session note',session.note,true);
  details.append(coordinatorFields);
  if(validThread(session.session)) {
    const command='codex resume '+session.session;
    details.append(node('pre',command,'command'),copyButton('Copy coordinator resume',command))
  }
  coordinator.append(details);
  root.append(coordinator);
  const history=node('section',undefined,'section');
  history.append(node('h3','Session history'));
  const events=[...session.history].reverse(),pages=Math.max(1,Math.ceil(events.length/historyPageSize));
  historyPage=Math.min(historyPage,pages-1);
  const controls=node('div',undefined,'history-controls'),prev=node('button','Previous'),next=node('button','Next');
  prev.type=next.type='button';
  prev.disabled=historyPage===0;
  next.disabled=historyPage>=pages-1;
  function changePage(delta) {
    historyPage+=delta;
    const scroll=root.scrollTop;
    renderInspector(record);
    updateAges();
    root.scrollTop=scroll;
    root.querySelector('.history-controls '+(delta>0?'button:last-child':'button:first-child'))?.focus( {
      preventScroll:true
    }
    )
  }
  prev.addEventListener('click',()=>changePage(-1));
  next.addEventListener('click',()=>changePage(1));
  controls.append(prev,node('span','Page '+(historyPage+1)+' of '+pages+' · '+events.length+' events'),next);
  history.append(controls);
  for(const event of events.slice(historyPage*historyPageSize,(historyPage+1)*historyPageSize)) {
    const entry=node('details',undefined,'event');
    entry.append(node('summary',new Date(event.at).toLocaleString()+' · '+label(event.kind)),node('pre',JSON.stringify(event.data,null,2)));
    history.append(entry)
  }
  if(!events.length)history.append(node('p','No history recorded.','muted'));
  root.append(history)
}
function updateAges() {
  const current=Date.now();
  for(const  {
    el,value,active,kind
  }
  of ages) {
    const seconds=elapsedSeconds(value,current),stale=isStale(value,active,current);
    el.textContent=relativeAge(seconds)+' since this '+kind.toLowerCase()+' posted'+(stale?' · stale; activity is unconfirmed':'');
    el.className='age'+(stale?' badge stale':'')
  }
  const metrics=snapshotMetrics(selectedSessions,current),summary=document.getElementById('summary'),summaryText=selectedSessions.length+' reported sessions · '+metrics.total+' tasks (cancelled excluded)';
  if(summary.textContent!==summaryText)summary.textContent=summaryText;
  const globalMetrics=snapshotMetrics((typeof sessions==='undefined'?selectedSessions:sessions).filter(session=>session.status==='active'),current),attention=document.getElementById('attention'),hidden=!(globalMetrics.staleTasks||globalMetrics.staleSessions||globalMetrics.blockedFailed),attentionText=globalMetrics.staleTasks+' stale active task'+(globalMetrics.staleTasks===1?'':'s')+' · '+globalMetrics.staleSessions+' stale active session'+(globalMetrics.staleSessions===1?'':'s')+' · '+globalMetrics.blockedFailed+' blocked/failed across projects. Activity is unconfirmed. Inspect native agent status and last output.';
  if(attention.hidden!==hidden)attention.hidden=hidden;
  if(attention.textContent!==attentionText)attention.textContent=attentionText;
  document.getElementById('board-age').textContent=' · '+relativeAge(elapsedSeconds(board.updated,current))+' since the latest post'
}

refresh.checked=preferences.refresh;
refresh.addEventListener('change',()=> {

);

);

);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
for(const name of ['run','session'])document.getElementById(name).addEventListener('change',event=> {

document.getElementById('show-tasks').addEventListener('click',()=>showView('tasks'));

for(const pane of ['details','plans']) {

const compact=matchMedia('(max-width:620px)'),signals=document.getElementById('signals');
signals.open=!compact.matches;
compact.addEventListener('change',event=>{if(!event.matches)signals.open=true});
document.getElementById('attention').title='Stale means no task/session post for at least '+Math.floor(staleSeconds/60)+' minutes; it does not prove work stopped.';
applyTheme();

  }

,10000);

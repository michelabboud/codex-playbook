<!doctype html>
<!-- codex-build-task-dashboard-v1 -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Codex · build task board</title>
<style>
:root{color-scheme:light;--ink:#182c41;--muted:#52697d;--paper:#f0f4f8;--line:#cdd8e1;--teal:#006358;--amber:#785100;--red:#a52a39}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Segoe UI",Arial,sans-serif}main{max-width:1180px;margin:36px auto;padding:0 24px}h1{font:700 clamp(30px,5vw,48px)/1.1 Bahnschrift,"Arial Narrow",sans-serif;margin:8px 0}h2{font-size:21px;margin:0}h3{font-size:16px;margin:0}.eyebrow{font:600 12px/1.5 Consolas,monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.sub,.detail,.identity{color:var(--muted)}.sub{margin:12px 0 22px}.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.toolbar label{font-size:13px;display:grid;gap:5px}.toolbar .refresh{display:flex;align-items:center;gap:6px;margin-left:auto}select,button{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:5px;background:#fff;padding:7px 10px;max-width:230px}button{cursor:pointer}select:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:3px}.project{margin-top:28px}.project-title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.project-path{font:12px/1.5 Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}.session{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:14px 0}.session-header{padding:18px 20px;border-bottom:1px solid var(--line)}.headline{display:flex;justify-content:space-between;gap:12px;align-items:start}.identity{font:12px/1.6 Consolas,monospace;overflow-wrap:anywhere;margin:7px 0}.note{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 20px;background:#f8fafc}.gate{padding-left:10px;border-left:3px solid var(--line)}.gate span{font-size:12px;color:var(--muted);display:block}.gate strong{font-size:14px;font-weight:650}.passed,.done{background:#dbefe9;color:#005347}.failed,.rejected{background:#ffe5e7;color:#932234}.blocked,.stale{background:#fff0d3;color:#785100}.running,.testing,.review{background:#e2edfa;color:#234f7c}.badge{display:inline-block;border-radius:4px;padding:3px 8px;font-size:12px;white-space:nowrap}.queued,.cancelled,.pending,.unavailable,.not_required,.not_requested,.active,.completed,.handoff,.stopped{background:#edf2f6;color:#4b6175}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 20px;background:#f8fafc}td{padding:14px 20px;border-top:1px solid #e1e8ee;vertical-align:top}td:first-child{width:64%}.task-title{font-weight:650}.detail{font-size:14px;margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.links{display:flex;gap:14px;flex-wrap:wrap;margin:5px 0 0;font-size:13px}a{color:#235b88;overflow-wrap:anywhere}.owner{font-size:13px;overflow-wrap:anywhere}.session-footer{padding:12px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.age{font-size:12px;display:inline-block;margin-top:3px}.history{border-top:1px solid var(--line);padding:12px 20px;font-size:13px}summary{cursor:pointer;color:var(--muted)}.event{padding:10px 0;border-bottom:1px solid #e1e8ee}.event pre{font:12px/1.5 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}.empty{padding:24px;color:var(--muted)}footer{color:var(--muted);font-size:13px;margin:22px 0 30px;display:flex;gap:20px;justify-content:space-between}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){main{margin:22px auto;padding:0 14px}.toolbar{gap:10px}.toolbar .refresh{margin-left:0}.headline{display:block}.gates{gap:6px;padding:12px}.gate{padding-left:6px}th{display:none}tr{display:block;border-top:1px solid var(--line);padding:12px}td,td:first-child{display:block;width:auto;border:0;padding:3px 0}.session-header{padding:14px}.project-path{width:100%}footer{display:block}}
</style></head><body><main>
<header><div class="eyebrow">Codex · shared local task board</div><h1>Every session. One view.</h1><p class="sub">Build work across your projects, with the evidence and gates kept visible.</p></header>
<nav class="toolbar" aria-label="Task filters and refresh"><label>Project<select id="project"><option value="">All projects</option></select></label><label>Run<select id="run"><option value="">All runs</option></select></label><label>Session<select id="session"><option value="">All sessions</option></select></label><label class="refresh"><input type="checkbox" id="refresh" checked> Refresh every 10 s</label><button id="reload" type="button">Refresh now</button></nav>
<p id="summary" class="sub" aria-live="polite"></p><div id="projects"></div>
<footer><div>Snapshot saved <time id="updated"></time><span id="board-age" class="age"></span></div><span>Sessions post updates as work changes.<br>Browser refresh reads the saved snapshot.</span></footer>
</main><script type="application/json" id="board-data">"__BOARD_JSON__"</script><script>
'use strict';
const board=JSON.parse(document.getElementById('board-data').textContent),staleSeconds=__STALE_SECONDS__,sessions=Object.values(board.sessions),ages=[];
const label=value=>value.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase());
function node(tag,content,cls){const el=document.createElement(tag);if(content!==undefined)el.textContent=content;if(cls)el.className=cls;return el}
function badge(status){return node('span',label(status),'badge '+status)}
function timeNode(value){const el=node('time',new Date(value).toLocaleString());el.dateTime=value;return el}
function ageNode(value,active){const el=node('span','','age');ages.push({el,value,active});return el}
function links(values){const out=node('div',undefined,'links');for(const [i,url] of values.entries()){const a=node('a','Evidence '+(i+1));a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.title=url;out.append(a)}return out}
const params=new URLSearchParams(location.hash.slice(1));
for(const field of ['project','run','session']){const select=document.getElementById(field),values=[...new Set(sessions.map(s=>s[field]))].sort();for(const value of values){const option=node('option',field==='project'?value.split(/[\\/]/).pop()+' · '+value:value);option.value=value;select.append(option)}select.value=params.get(field)||'';select.addEventListener('change',()=>{const query=new URLSearchParams();for(const name of ['project','run','session']){const value=document.getElementById(name).value;if(value)query.set(name,value)}location.hash=query.toString();render()})}
function render(){ages.length=0;const root=document.getElementById('projects');root.replaceChildren();let selected=sessions.filter(s=>['project','run','session'].every(field=>!document.getElementById(field).value||s[field]===document.getElementById(field).value));selected.sort((a,b)=>a.project.localeCompare(b.project)||b.updated.localeCompare(a.updated)||a.session.localeCompare(b.session));const groups=new Map();for(const s of selected){if(!groups.has(s.project))groups.set(s.project,[]);groups.get(s.project).push(s)}document.getElementById('summary').textContent=selected.length+' session'+(selected.length===1?'':'s')+' · '+selected.filter(s=>s.status==='active').length+' active · snapshot '+board.revision;
for(const [project,items] of groups){const group=node('section',undefined,'project'),heading=node('div',undefined,'project-title');heading.append(node('h2',project.split(/[\\/]/).pop()),node('span',project,'project-path'));group.append(heading);
for(const s of items){const card=node('article',undefined,'session'),head=node('div',undefined,'session-header'),line=node('div',undefined,'headline');line.append(node('h3',s.title),badge(s.status));head.append(line,node('div','Run '+s.run+' · Session '+s.session,'identity'));if(s.note)head.append(node('p',s.note,'note'));card.append(head);const gates=node('div',undefined,'gates');for(const [field,title] of [['build','Build acceptance'],['review','Review acceptance'],['release','Release publication']]){const gate=node('div',undefined,'gate');gate.append(node('span',title),badge(s[field]));gates.append(gate)}card.append(gates);
const table=node('table'),thead=node('thead'),headerRow=node('tr');for(const title of ['Task','Status','Owner']){const th=node('th',title);th.scope='col';headerRow.append(th)}thead.append(headerRow);table.append(thead);const body=node('tbody');for(const task of Object.values(s.tasks)){const row=node('tr'),title=node('td');title.append(node('div',task.title,'task-title'));if(task.detail)title.append(node('p',task.detail,'detail'));if(task.evidence.length)title.append(links(task.evidence));const status=node('td');status.append(badge(task.status));row.append(title,status,node('td',task.owner||'Unassigned','owner'));body.append(row)}table.append(body);if(body.children.length)card.append(table);else card.append(node('div','No tasks posted yet.','empty'));
const foot=node('div',undefined,'session-footer');foot.append(node('span','Session updated '),timeNode(s.updated),node('br'),ageNode(s.updated,s.status==='active'));card.append(foot);
const history=node('details',undefined,'history');history.append(node('summary','Saved history · '+s.history.length+' events'));history.addEventListener('toggle',()=>{if(!history.open||history.dataset.loaded)return;history.dataset.loaded='true';for(const event of [...s.history].reverse()){const entry=node('div',undefined,'event');entry.append(timeNode(event.at),node('span',' · '+label(event.kind)),node('pre',JSON.stringify(event.data,null,2)));history.append(entry)}});card.append(history);group.append(card)}root.append(group)}if(!selected.length)root.append(node('div','No sessions match these filters.','empty'));updateAges()}
function updateAges(){for(const {el,value,active} of ages){const seconds=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/1000));el.textContent=seconds<60?'Saved less than a minute ago':Math.floor(seconds/60)+' minutes since this session posted';el.className='age'+(active&&seconds>=staleSeconds?' badge stale':'');if(active&&seconds>=staleSeconds)el.textContent+=' · stale snapshot; activity is unconfirmed'}const seconds=Math.max(0,Math.floor((Date.now()-new Date(board.updated).getTime())/1000));document.getElementById('board-age').textContent=' · '+Math.floor(seconds/60)+' minutes since the latest post'}
const refresh=document.getElementById('refresh');try{refresh.checked=localStorage.getItem('codex-build-dashboard-refresh')!=='off'}catch{}refresh.addEventListener('change',()=>{try{localStorage.setItem('codex-build-dashboard-refresh',refresh.checked?'on':'off')}catch{}});document.getElementById('reload').addEventListener('click',()=>location.reload());document.getElementById('updated').replaceWith(Object.assign(timeNode(board.updated),{id:'updated'}));render();setInterval(updateAges,1000);setInterval(()=>{if(refresh.checked)location.reload()},10000);
</script></body></html>
